  <rect x="10" y="17" width="26" height="2" rx="1" fill="white" opacity="0.4"/>
  <!-- EG monogram -->
  <text x="23" y="37" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">EG</text>
</svg>
